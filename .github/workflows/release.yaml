name: Validate or publish Go SDK
run-name: Go SDK ${{ inputs.mode }} v${{ inputs.set_version }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Validate with test or verify publication with direct
        type: choice
        options: [test, direct]
        default: test
      set_version:
        description: Exact immutable SDK SemVer
        type: string
        required: true
      source_revision:
        description: Exact deployed x402api Git revision
        type: string
        required: true
      contract_digest:
        description: Canonical production OpenAPI sha256 digest
        type: string
        required: true

permissions:
  contents: read

jobs:
  pull-request-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate source provenance and module
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          contract = json.loads(pathlib.Path('.openapi/openapi.json').read_text())
          manifest = json.loads(pathlib.Path('.x402api/release.json').read_text())
          canonical = json.dumps(contract, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          digest = f"sha256:{hashlib.sha256(canonical).hexdigest()}"
          if manifest.get('record_type') != 'x402api-sdk-source':
              raise SystemExit('invalid release manifest record type')
          if manifest.get('version') != contract.get('info', {}).get('version'):
              raise SystemExit('manifest and SDK contract versions differ')
          if manifest.get('sdk_openapi_sha256') != digest:
              raise SystemExit(f'SDK contract digest mismatch: {digest}')
          PY
          test "$(sed -n 's/^module //p' go.mod)" = "github.com/x402api-com/x402api-go"
          go test ./...
          git diff --check

  validate-or-publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the exact deployed production contract
        shell: bash
        env:
          SDK_MODE: ${{ inputs.mode }}
          SDK_VERSION: ${{ inputs.set_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_DIGEST: ${{ inputs.contract_digest }}
        run: |
          set -Eeuo pipefail
          [[ "${SDK_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CONTRACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          headers="${RUNNER_TEMP}/production-health.headers"
          public_contract="${RUNNER_TEMP}/public-openapi.json"
          sdk_contract="${RUNNER_TEMP}/sdk-openapi.json"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --dump-header "${headers}" \
            --output /dev/null https://api.x402api.com/health/ready
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output "${public_contract}" https://api.x402api.com/openapi/openapi.json
          python scripts/render-openapi.py --input "${public_contract}" --output "${sdk_contract}"
          python - "${headers}" "${public_contract}" "${sdk_contract}" <<'PY'
          import hashlib, json, os, pathlib, sys
          revisions = [line.split(':', 1)[1].strip() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.lower().startswith('x-x402api-release:')]
          if revisions != [os.environ['SOURCE_REVISION']]:
              raise SystemExit(f"production revision mismatch: {revisions!r}")
          public = json.loads(pathlib.Path(sys.argv[2]).read_text())
          canonical = json.dumps(public, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          digest = f"sha256:{hashlib.sha256(canonical).hexdigest()}"
          if digest != os.environ['CONTRACT_DIGEST']:
              raise SystemExit(f"production contract digest mismatch: {digest}")
          manifest = json.loads(pathlib.Path('.x402api/release.json').read_text())
          expected = {'record_type': 'x402api-sdk-source', 'version': os.environ['SDK_VERSION'], 'source_revision': os.environ['SOURCE_REVISION'], 'openapi_sha256': os.environ['CONTRACT_DIGEST']}
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"release manifest {key} mismatch")
          rendered = json.loads(pathlib.Path(sys.argv[3]).read_text())
          canonical = json.dumps(rendered, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          if manifest.get('sdk_openapi_sha256') != f"sha256:{hashlib.sha256(canonical).hexdigest()}":
              raise SystemExit('SDK contract digest mismatch')
          if json.loads(pathlib.Path('.openapi/openapi.json').read_text()) != rendered:
              raise SystemExit('checked-in SDK contract differs from production render')
          PY
          test "$(sed -n 's/^module //p' go.mod)" = "github.com/x402api-com/x402api-go"
          go test ./...
          git diff --check

      - name: Require the immutable module tag
        if: inputs.mode == 'direct'
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
        run: |
          set -Eeuo pipefail
          tag="v${SDK_VERSION}"
          git rev-parse --verify "refs/tags/${tag}^{commit}"
          test "$(git rev-list -n 1 "${tag}")" = "${GITHUB_SHA}"

      - name: Verify public Go module resolution
        if: inputs.mode == 'direct'
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
        run: |
          set -Eeuo pipefail
          expected="github.com/x402api-com/x402api-go v${SDK_VERSION}"
          resolved=""
          for _ in $(seq 1 30); do
            resolved="$(GOPROXY=https://proxy.golang.org go list -m "github.com/x402api-com/x402api-go@v${SDK_VERSION}" 2>/dev/null || true)"
            [[ "${resolved}" = "${expected}" ]] && break
            sleep 5
          done
          test "${resolved}" = "${expected}"
